
name: Deploy Wordy Web to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio web
        run: |
          mkdir -p deploy
          cp -r public_html/. deploy/

          cat > deploy/package.json <<'EOF'
          {
            "name": "wordy-web",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js"
            }
          }
          EOF

          cat > deploy/server.js <<'EOF'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const root = __dirname;
          const types = {
            '.html': 'text/html; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.js': 'application/javascript; charset=utf-8',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.gif': 'image/gif',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon',
            '.webp': 'image/webp'
          };

          http.createServer((req, res) => {
            let pathname;

            try {
              pathname = decodeURIComponent(
                new URL(req.url, 'http://localhost').pathname
              );
            } catch {
              res.writeHead(400);
              return res.end('Solicitud no válida');
            }

            if (pathname.includes('..')) {
              res.writeHead(400);
              return res.end('Solicitud no válida');
            }

            if (pathname === '/') pathname = '/index.html';

            const file = path.join(root, pathname);

            fs.readFile(file, (err, data) => {
              if (err) {
                res.writeHead(404);
                return res.end('Página no encontrada');
              }

              res.writeHead(200, {
                'Content-Type':
                  types[path.extname(file).toLowerCase()] ||
                  'application/octet-stream'
              });

              res.end(data);
            });
          }).listen(process.env.PORT || 8080);
          EOF

          cd deploy
          zip -r ../wordy-web.zip .

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_104FF54E83CF415AA98EDCA1146A2788 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_232897F668FE43179A9F9C37E38E76FA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D9B6FC8A23C4475F89DACFFF518022B7 }}

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: wordy-web-zamudio
          slot-name: Production
          package: wordy-web.zip
