<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordy | Crear Cuenta</title>
  <link rel="stylesheet" href="estilos/estilo.css">
</head>
<body>

  <div class="logo">
    <img src="img/wordy_logo.png" alt="Wordy">
  </div>

  <main class="contenedor">
    <h1 class="titulo">¡Únete a Wordy!</h1>
    <p class="subtitulo">Crea tu cuenta para empezar la aventura</p>

    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#fff8ec" stroke="#1f2a4d" stroke-width="2.5"/>
        <circle cx="24" cy="18" r="8" fill="#1f2a4d"/>
        <path d="M8 38c2-8 8-11 16-11s14 3 16 11c-4 4-9 6-16 6s-12-2-16-6z" fill="#1f2a4d"/>
      </svg>
    </div>

    <!-- FORMULARIO DE REGISTRO CONECTADO A SPRING BOOT -->
    <form id="formRegistro" class="tarjeta" novalidate>
      <h2>Crea tu cuenta</h2>

      <div class="campo">
        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
        <span class="error">Ingresa tu nombre.</span>
      </div>

      <div class="campo">
        <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
        <span class="error">Ingresa un usuario.</span>
      </div>

      <div class="campo">
        <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required>
        <span class="error">Ingresa una contraseña.</span>
      </div>

      <div class="campo">
        <select id="tipo_cuenta" name="tipo_cuenta" required>
          <option value="" selected disabled hidden>Tipo de cuenta</option>
          <option value="estudiante">Estudiante (Niño)</option>
          <option value="tutor">Padre / Tutor</option>
        </select>
        <span class="error">Selecciona un tipo de cuenta.</span>
      </div>

      <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>
    </form>

    <div class="botones">
      <button type="submit" form="formRegistro" class="btn btn-rojo">Registrarse</button>
      <a href="index.html" class="btn btn-naranja">Volver al Login</a>
    </div>
  </main>

  <!-- Importante: Cargamos el script.js que ya tiene la lógica de registro -->
  <script src="script.js"></script>
</body>
</html>
